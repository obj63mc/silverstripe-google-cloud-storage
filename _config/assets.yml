---
Name: silverstripegooglecloudstorage-flysystem-cache
---
SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.gcsCache:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: "gcsCache"
      disable-container: true
---
Name: silverstripegooglecloudstorage-flysystem
Only:
  envvarset:
    - GC_BUCKET_NAME
    - GC_KEY_FILE
After:
  - "#assetsflysystem"
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\GoogleCloudStorage\Adapter\BucketAdapter:
    constructor:
      bucketName: "`GC_BUCKET_NAME`"
      keyFile: "`GC_KEY_FILE`"
  SilverStripe\Assets\Flysystem\PublicAdapter:
    class: SilverStripe\GoogleCloudStorage\Adapter\PublicAdapter
    constructor:
      bucketAdapter: '%$SilverStripe\GoogleCloudStorage\Adapter\BucketAdapter'
      prefix: "`GC_PUBLIC_BUCKET_PREFIX`"
  SilverStripe\Assets\Flysystem\ProtectedAdapter:
    class: SilverStripe\GoogleCloudStorage\Adapter\ProtectedAdapter
    constructor:
      bucketAdapter: '%$SilverStripe\GoogleCloudStorage\Adapter\BucketAdapter'
      prefix: "`GC_PROTECTED_BUCKET_PREFIX`"
---
Name: silverstripegooglecloudstorage-assetscore
Only:
  envvarset:
    - GC_BUCKET_NAME
    - GC_KEY_FILE
After:
  - "#assetsflysystem"
  - "#assetscore"
---
SilverStripe\Core\Injector\Injector:
  # Define our SS asset backend
  SilverStripe\Assets\Storage\AssetStore:
    class: SilverStripe\GoogleCloudStorage\GoogleCloudStorageFlysystemAssetStore
    properties:
      PublicFilesystem: '%$League\Flysystem\Filesystem.public'
      ProtectedFilesystem: '%$League\Flysystem\Filesystem.protected'
  SilverStripe\Assets\Storage\GeneratedAssetHandler:
    class: SilverStripe\Assets\Flysystem\GeneratedAssets
    properties:
      Filesystem: '%$League\Flysystem\Filesystem.public'
  SilverStripe\View\Requirements_Backend:
    properties:
      AssetHandler: '%$SilverStripe\Assets\Storage\GeneratedAssetHandler'
---
Name: silverstripegooglecloudstorage-cdn
Only:
  envvarset:
    - GC_BUCKET_NAME
    - GC_KEY_FILE
    - GC_PUBLIC_CDN_PREFIX
After:
  - "#assetsflysystem"
  - "#silverstripegooglecloudstorage-flysystem"
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Assets\Flysystem\PublicAdapter:
    class: SilverStripe\GoogleCloudStorage\Adapter\PublicCDNAdapter
    constructor:
      bucketAdapter: '%$SilverStripe\GoogleCloudStorage\Adapter\BucketAdapter'
      prefix: "`GC_PUBLIC_BUCKET_PREFIX`"
      visibility: null
      mimeTypeDetector: null
      cdnPrefix: "`GC_PUBLIC_CDN_PREFIX`"
---
Name: silverstripegooglecloudstorage-errorpage
Only:
  envvarset:
    - GC_BUCKET_NAME
    - GC_KEY_FILE
After:
  - "#errorpage-extensions"
---
SilverStripe\ErrorPage\ErrorPage:
  store_filepath: 'error-pages'
---
Name: silverstripegooglecloudstorage-cdn-imageeditor
Only:
  envvarset:
    - GC_BUCKET_NAME
    - GC_KEY_FILE
    - GC_PUBLIC_CDN_PREFIX
  classexists: SilverStripe\AssetAdmin\Model\ImageEditor
---
# Give edited images a new filename, as the CDN would keep serving the cached image from the old one
SilverStripe\AssetAdmin\Model\ImageEditor:
  extensions:
    - SilverStripe\GoogleCloudStorage\Extensions\ImageEditorExtension
